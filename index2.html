<!DOCTYPE html>
<html lang='th'>

<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <style>
    body {
      font-family: Arial;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      font-size:20px;
    }

    button,
    input,
    select {
      padding: 8px;
      margin: 4px;
      font-size:20px;
    }
  </style>
</head>

<body>
  <div id='app'></div>
  <script>
    let players = ['ปุ๊กกี้', 'โจ๋', 'อีฟ', 'บีม', 'พลอย', 'ซ้ง','บิว', 'อุ๋ม'],
      victim = '',
      guard = '',
      confess = {},
      i = 0;

    const app = document.getElementById('app');

    function setup() {
      app.innerHTML = '<h2>ผู้เล่น</h2><ul>'
        + players.map((p, n) => `<li>${p} <button onclick="players.splice(${n},1);setup()">ลบ</button></li>`).join('')
        + '</ul>'
        + '<input id=x>'
        + '<button onclick="if(x.value){players.push(x.value);setup()}">เพิ่ม</button>'
        + '<br>'
        + '<button onclick="witch()">เริ่มเกม</button>';
    }

    function witch() {
      app.innerHTML = `<h3>🧙‍♀️แม่มดเลือกเหยื่อ 🧙‍</h3>`
        + sel("v")
        + `<br>`
        + `<button onclick="victim=document.getElementById('v').value;guardPage()">ยืนยัน</button>`;
    }
    
    function guardPage() {
      app.innerHTML = `<h3>😇สายตรวจเลือกปกป้อง😇</h3>`
        + sel("g")
        + `<br>`
        + `<button onclick="guard=document.getElementById('g').value;i=0;confess={};confessPage()">ยืนยัน</button>`;
    }

    function confessPage() {
      let text = "😇 คืนนี้ผู้ถูกปกป้อง คือ "+ guard ;
      app.innerHTML = `<h3> คืนนี้ผู้ถูกปกป้อง คือ "${guard}" </h3>`
       + `<h3>ขั้นตอนสารภาพบาป... </h3>`
        + `<button onclick="result()">เปิดชื่อผู้ถูกสังหาร💀 </button>`;
       
    }

 
    function result() {
      let text = "💀 คืนนี้ผู้ถูกสังหาร คือ " + victim ;
      
      app.innerHTML = `<h2>${text}</h2>`
        + `<button onclick="resetGame()">เริ่มคืนใหม่</button>`
        + `<button onclick="setup()">กลับหน้าแรก</button>`;
    }

    function sel(id) {
      return `<select id="${id}">`
        + players.map(p => `<option>${p}</option>`).join("")
        + `</select>`;
    }

    function resetGame() {
      victim = "";
      guard = "";
      confess = {};
      i = 0;
      witch();
    }

    setup();
  </script>
</body>

</html>
